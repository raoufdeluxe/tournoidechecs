<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joueurs — Grand Prix des Échecs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="chess-icon">♟️</span> Grand Prix des Échecs
                <svg class="chief-icon" viewBox="0 0 140 80" xmlns="http://www.w3.org/2000/svg" aria-label="Coiffe de plumes façon Mardi Gras Indian">
                    <!-- Grandes plumes dorées en éventail -->
                    <path d="M70 44 C64 24 58 4 46 -4 C56 8 60 22 62 40 Z" fill="#F5C518" transform="translate(0,4)"/>
                    <path d="M70 44 C60 28 48 12 30 6 C44 16 52 28 58 42 Z" fill="#EFB90C" transform="translate(0,4)"/>
                    <path d="M70 44 C56 34 40 26 20 26 C38 30 50 36 60 46 Z" fill="#FFDB58" transform="translate(0,4)"/>
                    <path d="M70 44 C58 42 44 44 28 52 C42 48 54 48 62 50 Z" fill="#D4A017" transform="translate(0,4)"/>
                    <path d="M70 44 C64 24 58 4 46 -4 C56 8 60 22 62 40 Z" fill="#F5C518" transform="translate(0,4) scale(-1,1) translate(-140,0)"/>
                    <path d="M70 44 C60 28 48 12 30 6 C44 16 52 28 58 42 Z" fill="#EFB90C" transform="translate(0,4) scale(-1,1) translate(-140,0)"/>
                    <path d="M70 44 C56 34 40 26 20 26 C38 30 50 36 60 46 Z" fill="#FFDB58" transform="translate(0,4) scale(-1,1) translate(-140,0)"/>
                    <path d="M70 44 C58 42 44 44 28 52 C42 48 54 48 62 50 Z" fill="#D4A017" transform="translate(0,4) scale(-1,1) translate(-140,0)"/>
                    <!-- Nervures des plumes -->
                    <path d="M70 48 L46 4" stroke="#B8860B" stroke-width="1" opacity="0.5" fill="none"/>
                    <path d="M70 48 L94 4" stroke="#B8860B" stroke-width="1" opacity="0.5" fill="none"/>
                    <!-- Bandeau perlé -->
                    <rect x="42" y="46" width="56" height="14" rx="7" fill="#4E2067"/>
                    <circle cx="52" cy="53" r="3" fill="#D4A017"/>
                    <circle cx="62" cy="53" r="3" fill="#1B8A5A"/>
                    <circle cx="72" cy="53" r="3" fill="#D4A017"/>
                    <circle cx="82" cy="53" r="3" fill="#1B8A5A"/>
                    <circle cx="88" cy="53" r="3" fill="#D4A017"/>
                </svg>
            </h1>
            <p>Poule qualificative · Demi-finales · Grande Finale</p>
            <button id="btn-menu" class="menu-toggle" type="button" aria-label="Ouvrir le menu"
                    aria-expanded="false" aria-controls="main-menu" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <nav id="main-menu" class="main-menu" aria-labelledby="btn-menu" hidden>
                <a class="menu-item" href="./">♟️ Accueil</a>
                <a class="menu-item" href="./tournois">📋 Tournois</a>
                <a class="menu-item" href="./joueurs" aria-current="page">👥 Joueurs</a>
                <a class="menu-item" href="./stats">📊 Stats</a>
                <a class="menu-item" href="./sauvegarde">💾 Sauvegarde</a>
            </nav>
        </header>

        <div class="card">
            <h2 class="card-title">👥 Joueurs</h2>
            <p class="card-intro">Ces joueurs sont réutilisables d'un tournoi à l'autre.
               Renommer quelqu'un ici le renomme dans tous ses tournois, passés compris.</p>
            <div id="joueurs-editor"></div>

            <div class="joueur-row joueur-row--nouveau">
                <input type="text" id="joueur-nouveau-nom" class="joueur-nom" maxlength="64" placeholder="Nom du joueur">
                <input type="number" id="joueur-nouveau-elo" class="joueur-elo" placeholder="Elo" min="0" step="1">
                <button class="secondary" onclick="addJoueurFromForm()">Ajouter</button>
            </div>

            <div class="players-actions">
                <button onclick="saveJoueursFromForm()">Enregistrer les modifications</button>
            </div>
        </div>


    </div>

    <script src="js/core.js"></script>
    <script src="js/notice.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/joueurs.js"></script>
    <script src="js/page-joueurs.js"></script>
</body>
</html>
